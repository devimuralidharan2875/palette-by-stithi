databases:
  - name: palette-db
    databaseName: palette
    user: palette
    plan: free
    region: oregon

services:
  - type: web
    name: palette-by-stithi
    runtime: node
    region: oregon
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: palette-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false